[package]
name = "burnin"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "GPU burn-in and stress testing"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["gpu", "cuda", "stress-test", "burn-in", "hardware"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
cudarc = { version = "=0.19.10", default-features = false, features = ["std", "driver", "cublas", "cublaslt", "nvrtc", "f16", "dynamic-loading", "cuda-13000"] }
half = { version = "2.7.1", default-features = false }
nvml-wrapper = "0.13.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSProcessInfo", "NSRange", "NSString"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLBlitCommandEncoder", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLDevice", "MTLLibrary", "MTLResource", "MTLTypes"] }
objc2-metal-performance-shaders = { version = "0.3.2", default-features = false, features = ["std", "MPSCore", "MPSCoreTypes", "MPSKernel", "MPSMatrix", "MPSMatrixMultiplication"] }

[profile.release]
lto = "thin"
codegen-units = 1
